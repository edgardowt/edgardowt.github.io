<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Libro de inversiones</title>
<style>
*{box-sizing:border-box}body{font:13px/1.35 "Segoe UI",system-ui,Arial,sans-serif;margin:0;background:#eef1f5;color:#1d2733}
#login{max-width:320px;margin:18vh auto;text-align:center;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 10px #0002}
input,button{font:inherit}#login input{padding:8px 10px;width:90%;margin:6px 0}button{cursor:pointer}
#login button{padding:8px 18px;background:#1f3b57;color:#fff;border:0;border-radius:4px}#err{color:#b00020;min-height:1.3em;margin-top:6px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#1f3b57;color:#fff;padding:10px 16px}
header h1{font-size:17px;margin:0;flex:1}header span{opacity:.8}header button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:4px;padding:4px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 12px 0;background:#dfe5ec}
.tabs button{border:0;background:#c9d2dd;padding:8px 14px;border-radius:6px 6px 0 0;color:#33414f}
.tabs button.on{background:#fff;color:#1f3b57;font-weight:600}
main{background:#fff;padding:12px 16px 24px;min-height:70vh}
h2{font-size:14px;margin:16px 0 6px;color:#1f3b57}
details{margin:6px 0;color:#4a5a6a}details summary{cursor:pointer;font-weight:600}details p{margin:6px 0;max-width:110ch}
.w{overflow:auto;max-height:68vh;border:1px solid #cfd6de;border-radius:4px;margin-bottom:6px}.w.s{max-height:none;display:inline-block;max-width:100%}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#1f3b57;color:#fff;font-weight:600;padding:6px 8px;text-align:center;border-right:1px solid #ffffff33;white-space:normal;min-width:70px;max-width:190px;z-index:2}
td{padding:4px 8px;border-bottom:1px solid #e6eaef;white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}td.neg{color:#c0262d}
tbody tr:nth-child(even) td{background:#f5f8fb}tbody tr:hover td{background:#e8f0fa}tr.tot td{font-weight:700;background:#e3ebf4!important}
td.b-s{border-left:4px solid #c8102e}td.b-e{border-left:4px solid #2a7a4b}
td.in{background:#fff7cc!important;padding:2px 4px}td.in input{width:84px;text-align:right;border:1px solid #d9c35a;background:#fffdf0;padding:3px 5px;border-radius:3px}
td.calc{background:#eaf6ee!important;font-weight:600}
.hint{font-size:12px;color:#5c6b7a;margin:2px 0 8px}
</style></head><body>

async function descifrar(pass,d){
var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
var salt=b(d.salt),iv=b(d.iv),ct=b(d.ct),mac=b(d.mac);
var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:d.iter},base,512));
var hk=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
var msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
if(!(await crypto.subtle.verify("HMAC",hk,mac,msg)))throw new Error("clave");
var ek=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CTR",false,["decrypt"]);
var counter=new Uint8Array(16);counter.set(iv);
var pt=await crypto.subtle.decrypt({name:"AES-CTR",counter:counter,length:64},ek,ct);
return JSON.parse(new TextDecoder().decode(pt));}
